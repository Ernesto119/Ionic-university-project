<ion-header>
  <ion-toolbar>
    <ion-title>catalogo</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-row>
    <ion-col size="12" sizeMd="6" sizeLg="4" *ngFor="let item of items">
      <ion-card class="ion-padding">
        <ion-text>
          <h2>{{ item.name || item.title || 'Item' }}</h2>
          <p>{{ item.description || '' }}</p>
          <p *ngIf="item.price"><b>Price:</b> {{ item.price }}</p>
        </ion-text>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-content>
