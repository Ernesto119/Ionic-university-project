<ion-header>
  <ion-toolbar>
    <ion-title>catalogo</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-row>
    <ion-col size="12" sizeMd="6" sizeLg="4" *ngFor="let item of items">
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{item.nombre}}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <img [src]="item.image" alt="{{item.nombre}}">
          <ion-text>{{item.nombre}}</ion-text>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>

</ion-content>
